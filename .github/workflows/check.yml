name: Check Marktplaats

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - name: Search and notify
        shell: pwsh
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        # GitHub schedules at most every 5 minutes, so each run checks 3 times, 2 minutes apart.
        run: |
          foreach ($i in 1..3) {
            if ($i -gt 1) { Start-Sleep -Seconds 120 }
            ./check.ps1
          }

      - name: Save seen listings
        if: ${{ !cancelled() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898333+github-actions[bot]@users.noreply.github.com'
          git add seen.json
          git diff --cached --quiet || git commit -m 'Update seen listings'
          git pull --rebase
          git push
